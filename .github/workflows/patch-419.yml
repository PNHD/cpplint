name: Complete issue 419 contribution

on:
  push:
    branches:
      - ops/419-patch-worker

permissions:
  contents: write

jobs:
  complete-test-amend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: fix/419-github-output-format
          fetch-depth: 0

      - name: Add changelog and unit coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          expected_head = "5706053097c5b9d3ddfff29b66ea866c56b8b84f"
          if __import__("subprocess").check_output(["git", "rev-parse", "HEAD"], text=True).strip() != expected_head:
              raise SystemExit("Target branch moved; refusing to patch an unreviewed head")

          changelog = Path("CHANGELOG.rst")
          changelog_text = changelog.read_text(encoding="utf-8")
          marker = "TBA\n===\n\n"
          if changelog_text.count(marker) != 1:
              raise SystemExit("Could not locate TBA changelog section")
          changelog_text = changelog_text.replace(
              marker,
              marker
              + "* Added a ``--output=github`` format that emits GitHub Actions warning annotations. (#419)\n",
              1,
          )
          changelog.write_text(changelog_text, encoding="utf-8")

          cli_path = Path("cpplint_clitest.py")
          cli_text = cli_path.read_text(encoding="utf-8")
          escaping_test = '''\n\ndef test_github_output_escaping():\n    assert cpplint._EscapeGithubCommandData("100%\\r\\n") == "100%25%0D%0A"\n    assert cpplint._EscapeGithubCommandProperty("a,b:c") == "a%2Cb%3Ac"\n'''
          if cli_text.count(escaping_test) != 1:
              raise SystemExit("Could not locate CLI escaping test")
          cli_text = cli_text.replace(escaping_test, "", 1)
          cli_path.write_text(cli_text, encoding="utf-8")

          unit_path = Path("cpplint_unittest.py")
          unit_text = unit_path.read_text(encoding="utf-8")
          unit_marker = '\n\nif __name__ == "__main__":\n'
          if unit_text.count(unit_marker) != 1:
              raise SystemExit("Could not locate unit-test insertion point")
          unit_test = '''\n\ndef test_github_command_escaping():\n    assert cpplint._EscapeGithubCommandData("100%\\r\\n") == "100%25%0D%0A"\n    assert cpplint._EscapeGithubCommandProperty("a,b:c") == "a%2Cb%3Ac"\n'''
          unit_text = unit_text.replace(unit_marker, unit_test + unit_marker, 1)
          unit_path.write_text(unit_text, encoding="utf-8")
          PY

          git diff --check

      - name: Install validation tools
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pre-commit ruff==0.15.20

      - name: Format changed Python files
        run: |
          ruff format cpplint.py cpplint_clitest.py cpplint_unittest.py
          git diff --check
          git diff --stat

      - name: Run focused CLI regression
        run: python -m pytest --no-cov cpplint_clitest.py -k github_output -vv

      - name: Run focused unit regression
        run: python -m pytest --no-cov cpplint_unittest.py -k github_command_escaping -vv

      - name: Run full test suite
        run: python -m pytest -q

      - name: Run repository pre-commit checks
        run: |
          pre-commit run --files CHANGELOG.rst cpplint.py cpplint_clitest.py cpplint_unittest.py
          git diff --check

      - name: Amend verified contribution
        shell: bash
        run: |
          git config user.name "Dang Pham"
          git config user.email "26757735+PNHD@users.noreply.github.com"
          git add CHANGELOG.rst cpplint.py cpplint_clitest.py cpplint_unittest.py
          git commit --amend --no-edit --reset-author
          git push --force-with-lease origin HEAD:fix/419-github-output-format

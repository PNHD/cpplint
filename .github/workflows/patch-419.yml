name: Attribute issue 419 commit

on:
  push:
    branches:
      - ops/419-patch-worker

permissions:
  contents: write

jobs:
  rewrite-author:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified target branch
        uses: actions/checkout@v4
        with:
          ref: fix/419-github-output-format
          fetch-depth: 0

      - name: Verify exact tested tree and rewrite author
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "974e561b85514f43166ab65e2c14166fcd935985"
          test "$(git rev-parse HEAD^{tree})" = "a4ee294a8c5d8678494f0db811a7970262b0a7b1"
          test "$(git rev-parse HEAD^)" = "d03e546ad6ac8ed48f870b3c6502b90e892df6d8"
          git config user.name "Dang Pham"
          git config user.email "26757735+PNHD@users.noreply.github.com"
          git commit --amend --no-edit --reset-author
          test "$(git rev-parse HEAD^{tree})" = "a4ee294a8c5d8678494f0db811a7970262b0a7b1"
          git push --force-with-lease origin HEAD:fix/419-github-output-format

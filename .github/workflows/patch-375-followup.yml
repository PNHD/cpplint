name: Refine issue 375 fix

on:
  push:
    branches:
      - ops/375-patch-worker

permissions:
  contents: write

jobs:
  red-green-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: fix/375-top-level-include
          fetch-depth: 0

      - name: Verify target head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "1a8a07f8fd047021e962baa6d21720f764dce162"

      - name: Add same-directory regression first
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("cpplint_unittest.py")
          text = path.read_text(encoding="utf-8")

          setup = (
              '        nested_source = source_dir / "foo.cc"\n'
              '        nested_source.write_text("")\n'
          )
          setup_replacement = setup + (
              '        same_dir_header = source_dir / "utils.hpp"\n'
              '        same_dir_header.write_text("")\n'
          )
          if text.count(setup) != 1:
              raise SystemExit("Could not locate nested source setup")
          text = text.replace(setup, setup_replacement, 1)

          marker = (
              '        self.TestLanguageRulesCheck(\n'
              '            str(nested_source),\n'
              '            \'#include "foo.h"\',\n'
          )
          regression = (
              '        self.TestLanguageRulesCheck(\n'
              '            str(nested_source),\n'
              '            \'#include "utils.hpp"\',\n'
              '            "",\n'
              '        )\n'
          )
          if text.count(marker) != 1:
              raise SystemExit("Could not locate nested warning case")
          text = text.replace(marker, regression + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Install validation tools
        shell: bash
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pre-commit ruff==0.15.20

      - name: Confirm same-directory regression is red
        shell: bash
        run: |
          set +e
          python -m pytest --no-cov cpplint_unittest.py -k testBuildInclude -vv > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -q "utils.hpp" /tmp/red.log
          grep -q "Include the directory when naming header files" /tmp/red.log

      - name: Apply same-directory fix and update changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("cpplint.py")
          text = source.read_text(encoding="utf-8")
          needle = (
              "        match\n"
              "        and os.path.dirname(fileinfo.RepositoryName())\n"
              "        and IsHeaderExtension(match.group(2))\n"
          )
          replacement = (
              "        match\n"
              "        and os.path.dirname(fileinfo.RepositoryName())\n"
              "        and not os.path.isfile(\n"
              "            os.path.join(os.path.dirname(fileinfo.FullName()), match.group(1))\n"
              "        )\n"
              "        and IsHeaderExtension(match.group(2))\n"
          )
          if text.count(needle) != 1:
              raise SystemExit("Could not locate include_subdir condition")
          source.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.rst")
          text = changelog.read_text(encoding="utf-8")
          old = "* Allow top-level files to include top-level headers without a directory prefix. (#375)\n"
          new = "* Allow source files to include headers from the same directory without a directory prefix. (#375)\n"
          if text.count(old) != 1:
              raise SystemExit("Could not locate issue 375 changelog entry")
          changelog.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Format changed Python files
        shell: bash
        run: |
          ruff format cpplint.py cpplint_unittest.py
          git diff --check

      - name: Run focused regression
        shell: bash
        run: python -m pytest --no-cov cpplint_unittest.py -k testBuildInclude -vv

      - name: Run full test suite
        shell: bash
        run: python -m pytest -q

      - name: Run pylint
        shell: bash
        run: python -m pylint cpplint.py

      - name: Run repository pre-commit checks
        shell: bash
        run: |
          pre-commit run --files CHANGELOG.rst cpplint.py cpplint_unittest.py
          git diff --check

      - name: Commit verified follow-up
        shell: bash
        run: |
          git config user.name "Dang Pham"
          git config user.email "26757735+PNHD@users.noreply.github.com"
          git add CHANGELOG.rst cpplint.py cpplint_unittest.py
          git commit -m "fix: allow same-directory header includes"
          git push origin HEAD:fix/375-top-level-include

name: Verify issue 375 fix

on:
  push:
    branches:
      - ops/375-patch-worker

permissions:
  contents: write

jobs:
  red-green-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: fix/375-top-level-include
          fetch-depth: 0

      - name: Verify target head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "d03e546ad6ac8ed48f870b3c6502b90e892df6d8"

      - name: Add regression test first
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("cpplint_unittest.py")
          text = path.read_text(encoding="utf-8")
          function_start = text.index("    def testBuildInclude(self):")
          signature_end = function_start + len("    def testBuildInclude(self):")
          text = text[:function_start] + "    def testBuildInclude(self, tmp_path):" + text[signature_end:]

          function_start = text.index("    def testBuildInclude(self, tmp_path):")
          start = text.index("        self.TestLint(\n            '#include \"foo.h\"'", function_start)
          end = text.index("        self.TestLint(\n            '#include \"package/impl.c++\"'", start)
          replacement = (
              "        repo = tmp_path / \"repo\"\n"
              "        repo.mkdir()\n"
              "        (repo / \".git\").mkdir()\n"
              "        root_source = repo / \"foo.cc\"\n"
              "        root_source.write_text(\"\")\n"
              "        source_dir = repo / \"src\"\n"
              "        source_dir.mkdir()\n"
              "        nested_source = source_dir / \"foo.cc\"\n"
              "        nested_source.write_text(\"\")\n"
              "\n"
              "        self.TestLanguageRulesCheck(\n"
              "            str(root_source),\n"
              "            '#include \"foo.h\"',\n"
              "            \"\",\n"
              "        )\n"
              "        self.TestLanguageRulesCheck(\n"
              "            str(nested_source),\n"
              "            '#include \"foo.h\"',\n"
              "            \"Include the directory when naming header files  [build/include_subdir] [4]\",\n"
              "        )\n"
              "        self.TestLanguageRulesCheck(\n"
              "            str(nested_source),\n"
              "            '#include \"bar.hh\"',\n"
              "            \"Include the directory when naming header files  [build/include_subdir] [4]\",\n"
              "        )\n"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          git diff --check

      - name: Install validation tools
        shell: bash
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pre-commit ruff==0.15.20

      - name: Confirm regression test is red
        shell: bash
        run: |
          set +e
          python -m pytest --no-cov cpplint_unittest.py -k testBuildInclude -vv > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -q "Include the directory when naming header files" /tmp/red.log

      - name: Apply minimal fix and changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("cpplint.py")
          text = source.read_text(encoding="utf-8")
          needle = (
              "    if (\n"
              "        match\n"
              "        and IsHeaderExtension(match.group(2))\n"
              "        and not _third_party_headers_pattern.match(match.group(1))\n"
              "    ):\n"
          )
          replacement = (
              "    if (\n"
              "        match\n"
              "        and os.path.dirname(fileinfo.RepositoryName())\n"
              "        and IsHeaderExtension(match.group(2))\n"
              "        and not _third_party_headers_pattern.match(match.group(1))\n"
              "    ):\n"
          )
          if text.count(needle) != 1:
              raise SystemExit("Could not locate include_subdir condition")
          source.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.rst")
          text = changelog.read_text(encoding="utf-8")
          marker = "TBA\n===\n\n"
          if text.count(marker) != 1:
              raise SystemExit("Could not locate TBA changelog section")
          entry = "* Allow top-level files to include top-level headers without a directory prefix. (#375)\n"
          changelog.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Format changed Python files
        shell: bash
        run: |
          ruff format cpplint.py cpplint_unittest.py
          git diff --check

      - name: Run focused regression
        shell: bash
        run: python -m pytest --no-cov cpplint_unittest.py -k testBuildInclude -vv

      - name: Run full test suite
        shell: bash
        run: python -m pytest -q

      - name: Run pylint
        shell: bash
        run: python -m pylint cpplint.py

      - name: Run repository pre-commit checks
        shell: bash
        run: |
          pre-commit run --files CHANGELOG.rst cpplint.py cpplint_unittest.py
          git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "Dang Pham"
          git config user.email "26757735+PNHD@users.noreply.github.com"
          git add CHANGELOG.rst cpplint.py cpplint_unittest.py
          git commit -m "fix: allow top-level header includes"
          git push origin HEAD:fix/375-top-level-include
